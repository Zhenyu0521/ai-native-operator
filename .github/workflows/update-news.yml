name: Update AI Signals

on:
  workflow_dispatch:
  schedule:
    # 08:00 Asia/Shanghai
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update news data and page snapshot
        run: node scripts/update-news.mjs

      - name: Commit updated news data
        run: |
          if git diff --quiet data/news.json explore-news.html; then
            echo "No news changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json explore-news.html
          git commit -m "chore: update AI signals"
          git push
